<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A complete replica of the Netflix homepage with responsive design, animations, and SEO optimization">
    <title>Netflix clone</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <!-- Header -->
    <header class="bg-black text-white">
        <nav class="navbar navbar-expand-lg navbar-dark bg-black">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <svg viewBox="0 0 250 50" width="120" height="30" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#E50914" d="M245.6,43.6V6.5H33.8C15.1,6.5,0,21.6,0,40.3c0,18.8,15.1,33.8,33.8,33.8h211.8V43.6H245.6z"/>
                        <text x="33.8" y="30" font-family="Helvetica" font-size="20" fill="white" font-weight="bold">NETFLIX</text>
                    </svg>
                </a>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#">TV Shows</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#">Movies</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#">New & Popular</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#">My List</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero bg-black text-white">
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-6">
                    <h1 class="display-4">Enjoy on your TV.</h1>
                    <p class="lead">Watch on Smart TVs, Playstation, Xbox, Chromecast, Apple TV, Blu-ray players, and more.</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white mt-5">
        <div class="container">
            <p class="text-center">Made by ♥️ <a href="https://bio.link/samer" target="_blank" class="text-white">SAMER SAEID</a></p>
            <p class="text-center">Copyright SAMER SAEID</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
